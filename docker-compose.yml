# Zeus: vLLM (DiffusionGemma structured reads) and the Jev-compatible API on :8080,
# in one container. Two small encoder models run beside it on the same GPU, each
# in its own container; the zeus container passes their requests through, so
# :8080 serves all three models. CLM and JevK5 are opt-in: see the clm and jevk5 services.
# Build docker/Dockerfile.base first: all the images start FROM it and share its layers.
services:
  zeus:
    build: {context: ., dockerfile: docker/Dockerfile}
    image: zeus:0.1.0
    environment:
      ZEUS_CANVAS: "64"
      ZEUS_MAX_NUM_SEQS: ${ZEUS_MAX_NUM_SEQS:-64}
      ZEUS_MAX_MODEL_LEN: ${ZEUS_MAX_MODEL_LEN:-65536}
      ZEUS_GPU_UTIL: ${ZEUS_GPU_UTIL:-0.9}
      ZEUS_API_KEY: ${ZEUS_API_KEY:-}
      ZEUS_ORIGIN_SECRET: ${ZEUS_ORIGIN_SECRET:-}
      # with the clm or jevk5 profile, add clm-v0.1=http://clm:8080 or jevk5-0.2=http://jevk5:8080
      ZEUS_MODEL_ROUTES: ${ZEUS_MODEL_ROUTES:-laya-1.0=http://laya:8080,verdict-1.4=http://verdict:8080}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
      - flashinfer-cache:/root/.cache/flashinfer   # its NVFP4 MoE kernels, compiled on first start (about 4 min)
    ports:
      - "${ZEUS_BIND:-127.0.0.1}:8080:8080"
    ipc: host
    deploy: &gpu
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    restart: unless-stopped

  # The encoder models take 2.5 GB (Laya) and 1.2 GB (Verdict) of GPU memory, measured at a full batch.
  # Lower ZEUS_GPU_UTIL to leave vLLM's neighbours that much room.
  laya:
    build: {context: ., dockerfile: docker/Dockerfile.laya}
    image: zeus-laya:0.1.0
    environment: &encoder-env
      # the zeus container forwards the caller's key and origin secret, so these match it
      ZEUS_API_KEY: ${ZEUS_API_KEY:-}
      ZEUS_ORIGIN_SECRET: ${ZEUS_ORIGIN_SECRET:-}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      HF_TOKEN: ${HF_TOKEN:-}
    volumes: &hf
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    deploy: *gpu
    restart: unless-stopped

  verdict:
    build: {context: ., dockerfile: docker/Dockerfile.verdict}
    image: zeus-verdict:0.1.0
    environment: *encoder-env
    volumes: *hf
    deploy: *gpu
    restart: unless-stopped

  # CLM runs its own vLLM (Qwen3-8B-FP8, about 9 GB of weights), so it needs about 12 GB
  # beside DiffusionGemma: start it with --profile clm, lower ZEUS_GPU_UTIL for zeus,
  # and add it to ZEUS_MODEL_ROUTES.
  clm:
    build: {context: ., dockerfile: docker/Dockerfile.clm}
    image: zeus-clm:0.1.0
    profiles: [clm]
    environment:
      <<: *encoder-env
      ZEUS_GPU_UTIL: ${ZEUS_CLM_GPU_UTIL:-0.12}
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    ipc: host
    deploy: *gpu
    restart: unless-stopped

  # JevK5 runs its own vLLM too (bf16, 8.4 GB of weights): start it with --profile jevk5 and add
  # jevk5-0.2=http://jevk5:8080 to ZEUS_MODEL_ROUTES, leaving it room as for CLM.
  jevk5:
    build: {context: ., dockerfile: docker/Dockerfile.jevk5}
    image: zeus-jevk5:0.1.0
    profiles: [jevk5]
    environment:
      <<: *encoder-env
      ZEUS_GPU_UTIL: ${ZEUS_JEVK5_GPU_UTIL:-0.12}
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    ipc: host
    deploy: *gpu
    restart: unless-stopped

volumes:
  vllm-cache:
  flashinfer-cache:
