[project]
name = "zeus"
version = "0.1.0"
description = "Zeus: Next Labs System One decision server with typed, calibrated outputs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "transformers>=4.56", "tokenizers", "jinja2"]

[project.optional-dependencies]
test = ["pytest", "typesafe-sdk>=0.7"]
mlx = ["mlx-vlm==0.6.15; sys_platform == 'darwin' and platform_machine == 'arm64'"]
laya = ["laya==0.3.6"]
verdict = ["gliclass==0.1.20"]

[project.urls]
Homepage = "https://github.com/KayzenRoot/zeus"
Source = "https://github.com/KayzenRoot/zeus"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zeus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
